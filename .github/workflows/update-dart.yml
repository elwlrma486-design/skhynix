name: Update DART financial data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 5 * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CORP_CODE: "00164779"
        run: python scripts/update_financial_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial_data.csv data/raw
          git diff --cached --quiet || git commit -m "Update DART 10-year financial data"
          git push
